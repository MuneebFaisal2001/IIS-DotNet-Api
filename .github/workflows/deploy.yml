name: Build, Test and Deploy to IIS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Restore Dependencies
      run: dotnet restore

    - name: Run Automated Unit Tests
      run: dotnet test --no-restore --verbosity normal

    - name: Stop IIS Website
      run: |
        & "$env:windir\system32\inetsrv\appcmd.exe" stop site /site.name:"MyCustomApi"
        & "$env:windir\system32\inetsrv\appcmd.exe" stop apppool /apppool.name:"MyCustomApiPool"

    - name: Publish Web API
      run: |
        dotnet publish MyCustomApi/MyCustomApi.csproj -c Release -o C:\inetpub\wwwroot\MyCustomApi --no-restore

    - name: Start IIS Website
      run: |
        & "$env:windir\system32\inetsrv\appcmd.exe" start apppool /apppool.name:"MyCustomApiPool"
        & "$env:windir\system32\inetsrv\appcmd.exe" start site /site.name:"MyCustomApi"

    - name: Health Check (Up/Down Verification)
      run: |
        Start-Sleep -Seconds 3
        $response = Invoke-WebRequest -Uri "http://localhost:5070/health" -UseBasicParsing
        if ($response.StatusCode -eq 200 -and $response.Content -eq "Healthy") {
            Write-Host "Application is UP and Healthy on IIS!"
        } else {
            Write-Error "Application is DOWN or returned unhealthy status."
            exit 1
        }